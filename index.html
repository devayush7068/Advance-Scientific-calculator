<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">

    <div class="top-bar">
        <h2>Scientific Calculator</h2>
        <button id="themeBtn">☀️</button>
    </div>

    <div class="display">
        <div id="history">Ready</div>
        <input type="text" id="result" value="0" readonly>
    </div>

    <div class="mode">
        <button id="angleBtn">DEG</button>
        <button id="historyBtn">History</button>
        <button data-action="memory-clear">MC</button>
        <button data-action="memory-recall">MR</button>
    </div>

    <div class="buttons">

        <button data-value="sin(">sin</button>
        <button data-value="cos(">cos</button>
        <button data-value="tan(">tan</button>
        <button data-value="log(">log</button>
        <button data-value="ln(">ln</button>

        <button data-value="(">(</button>
        <button data-value=")">)</button>
        <button data-value="sqrt(">√</button>
        <button data-value="^2">x²</button>
        <button data-value="^">xʸ</button>

        <button data-value="π">π</button>
        <button data-value="e">e</button>
        <button data-value="!">n!</button>
        <button data-action="clear">AC</button>
        <button data-action="delete">⌫</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="/">÷</button>
        <button data-value="%">%</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="*">×</button>
        <button data-action="memory-add">M+</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="-">−</button>
        <button data-action="memory-subtract">M-</button>

        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button data-value="π">π</button>
        <button data-value="+">+</button>
        <button data-action="calculate" class="equal">=</button>

    </div>

    <div id="historyPanel" class="history-panel">
        <h3>Calculation History</h3>
        <button id="clearHistory">Clear History</button>
        <div id="historyList"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
